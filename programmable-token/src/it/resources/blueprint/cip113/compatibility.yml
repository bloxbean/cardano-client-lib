# Compatibility manifest for the vendored CIP-113 reference-contract snapshot.
#
# Build and review provenance only. Runtime compatibility is anchored by the explicit
# Cip113Deployment supplied to the service; this file records which contract surface the adapter
# was written and tested against. Cip113CompatibilityManifestTest recomputes every value here from
# plutus.json and the code, so re-vendoring a blueprint is a deliberate review, not a drop-in.
protocol: cip-113
contract_version: 0.5.0-alpha.2   # informational; not a compatibility selector
source:
  repository: https://github.com/cardano-foundation/cip113-programmable-tokens
  commit: 9db7e0629a1509cc9d41d069f0ef0ed251601173
blueprint:
  file: plutus.json
  sha256: bd297f36e9e955d814fb3a67fbc7e51c2344b54d952d38b03ef9f32c1d43b9ad
  aiken: v1.1.23+8949565
# Unapplied compiled-code hashes as the blueprint declares them. Every validator is
# parameterized, so a deployment's applied hashes differ; these pin the source, not a deployment.
validators:
  programmable_logic_base.programmable_logic_base.spend: af228b45d78e6f3b12cb8a4a12db8a7f236b130876398c5570c179a6
  transfer.transfer.withdraw: a0af5477a21bbbf6dcd8e41a67d25ed45893055b66268f03a25fb18e
