# Compatibility manifest for the vendored CIP-113 core contract snapshot.
#
# Build and review provenance only. Runtime compatibility is anchored by the explicit
# Cip113Deployment supplied to the service; this file records which contract surface the adapter
# was written and tested against. Cip113CompatibilityManifestTest recomputes every value here from
# plutus.json and the code, so re-vendoring a blueprint is a deliberate review, not a drop-in.
protocol: cip-113
contract_version: 0.0.1   # enforced on persisted plans by Cip113Protocol
source:
  repository: https://github.com/cardano-foundation/cip113-programmable-tokens
  commit: 6b75ba3286b4692ca23059ff51285db357fb09c6
blueprint:
  file: plutus.json
  sha256: b6c8cb096a15e02f1b9c719fb8c617b624c1aa7719f2258d45faa3e8f144e7b9
  aiken: v1.1.23+8949565
# Unapplied compiled-code hashes as the blueprint declares them. Every validator is
# parameterized, so a deployment's applied hashes differ; these pin the source, not a deployment.
validators:
  programmable_logic_base.programmable_logic_base.spend: d4f6ebcc3080846b8b89d93669ecce7b7690954aa69b4c2a0403b82e
  programmable_logic_global.programmable_logic_global.withdraw: aa3ca308e88da398f64155598480567c185de903d76364c3a863d0f4
  transfer.transfer.withdraw: 7603b8da42fab769ada90826522c415be6b2fd6708028b70620cff87
  third_party.third_party.withdraw: 5cc5ee86747ed2434ef7971880cd2272a5663e82e8194751dd38495b
  unfracking.unfracking.withdraw: 2f606a7f7ef297e6d7bcf1b599fc86fc9e1d79b45e80faa5e41de98c
  issuance_logic.issuance_logic.withdraw: 0cf4e4dbf3427deee66026e009454037450027a4ff048cdc524193d5
  issuance_mint.issuance_mint.mint: 4c6908082b69d025e58a65c3956eb3d306d91e4ebd2aba2a5caac4b6
  issuance_cbor_hex_mint.issuance_cbor_hex_mint.mint: f2ec7e1dcef11cc8d9430e7b077e3e9225ad7e46e6b58a9a5fdf5e01
  registry.registry.mint: 3d5e0abfae7f7e01c67853a397f2069c7e2ba214032745482d47f763
  registry.registry.spend: 3d5e0abfae7f7e01c67853a397f2069c7e2ba214032745482d47f763
  protocol_params.protocol_params.mint: 81926958b1a6a33fd68068ed1ff909dab60c519f0ec913bc3847c372
  protocol_params.protocol_params.spend: 81926958b1a6a33fd68068ed1ff909dab60c519f0ec913bc3847c372
  upgrade_multisig.upgrade_multisig.withdraw: 5364abcd89d524a3725d0fa003fccb9beb310d5fb911325351d93ed4
  always_fail.always_fail.spend: e9d8d9c7fc531f0b179d502c86bffee829613c537794dab053ae28fe
# Serialized programmable-token intent schema this adapter reads and writes.
schema_version: '1'
capabilities:
  implemented:
    - transfer
    - mint
    - burn
    - third_party_transfer
    - register
    - update_registry
    - unfrack
    - inline_datum
    - global_state
  unsupported:
    - verification-key transfer, third-party or unfracking credentials (the adapter invokes script credentials only; registrations and updates naming one are refused)
    - more than one policy per third-party transaction (the third_party redeemer names a single registry node)
    - unfracking combined with any other programmable operation in one transaction (the validator requires an empty mint)
    - unfracking on a deployment whose programmable_logic_global was compiled without the real unfracking script (every public v0.0.1 deployment; UNFRACK is then not advertised)
    - protocol-upgrade and authority operations (ProtocolUpgrade, NominateAuthority, PromoteAuthority)
    - concurrent use of one mutable Tx, TxPlan or TxContext (sequential reuse is supported)
