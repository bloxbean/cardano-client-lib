version: '1.0'
variables:
  owner_address: __runtime__
  bootstrap_tx: __runtime__
  network_id: 0
  token_unit: __runtime__
  transfer_quantity: 1
  authorization_cbor: d8798201182a
extensions:
  pt:
    extension: programmable-token
    schema_version: '1'
    protocol: cip-113
    contract_version: 0.5.0-alpha.2
    deployment:
      network: ${network_id}
      bootstrap_tx: ${bootstrap_tx}
context:
  fee_payer: ${owner_address}
transaction:
  - tx:
      from: ${owner_address}
      intents:
        - type: pt:transfer
          receiver: ${owner_address}
          unit: ${token_unit}
          quantity: ${transfer_quantity}
          transfer_redeemer_hex: ${authorization_cbor}
