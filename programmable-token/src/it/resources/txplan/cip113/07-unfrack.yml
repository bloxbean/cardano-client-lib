# Reserved unfracking intent. Retained as a rejection fixture: this release throws
# UnsupportedOperationException during validation, even when the token's hook is set.
version: '1.0'
variables:
  network_id: 0
  authorization_action: 1
  authorization_nonce: 42
extensions:
  pt:
    extension: programmable-token
    schema_version: '1'
    protocol: cip-113
    contract_version: 0.0.1
    deployment:
      network: ${network_id}
      bootstrap_tx: ${bootstrap_tx}
context:
  fee_payer: ${owner_address}
transaction:
  - tx:
      from: ${owner_address}
      intents:
        - type: pt:unfrack
          policy_id: ${policy_id}
          authorization:
            constructor: 0
            fields:
              - int: ${authorization_action}
              - int: ${authorization_nonce}
