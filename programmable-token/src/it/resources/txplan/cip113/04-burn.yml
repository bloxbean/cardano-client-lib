version: '1.0'
variables:
  owner_address: __runtime__
  bootstrap_tx: __runtime__
  network_id: 0
  policy_id: __runtime__
  asset_name_hex: 5478506c616e546f6b656e
  burn_quantity: 150
  authorization_action: 1
  authorization_nonce: 42
  authorization_cbor: d8798201182a
extensions:
  pt:
    extension: programmable-token
    schema_version: '1'
    protocol: cip-113
    contract_version: 0.5.0-alpha.2
    deployment:
      network: ${network_id}
      bootstrap_tx: ${bootstrap_tx}
context:
  fee_payer: ${owner_address}
transaction:
  - tx:
      from: ${owner_address}
      intents:
        - type: pt:burn
          policy_id: ${policy_id}
          assets:
            - name: ${asset_name_hex}
              quantity: ${burn_quantity}
          transfer_redeemer:
            constructor: 0
            fields:
              - int: ${authorization_action}
              - int: ${authorization_nonce}
          issuance_redeemer_hex: ${authorization_cbor}
