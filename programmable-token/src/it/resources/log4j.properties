# Integration-test logging. The suites report resolved deployment values and transaction hashes
# through SLF4J; Gradle shows them because integrationTest sets showStandardStreams = true.
log4j.rootLogger=WARN, stdout
log4j.logger.com.bloxbean.cardano.client.programmabletoken=INFO
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{HH:mm:ss.SSS} %-5p %c{1} - %m%n
