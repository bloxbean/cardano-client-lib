dependencies {
    api project(':core')
    api project(':function')
    api project(':backend')
    api project(':hd-wallet')

    // YAML/JSON serialization
    implementation libs.jackson.databind
    implementation libs.jackson.dataformat.yaml

    integrationTestImplementation(libs.slf4j.reload4j)
    integrationTestImplementation(libs.aiken.java.binding)

    integrationTestImplementation project(':')
    integrationTestImplementation project(':it-support')
    integrationTestImplementation project(':backend-modules:blockfrost')
    integrationTestImplementation project(':backend-modules:koios')
    integrationTestImplementation project(':backend-modules:ogmios')

    integrationTestAnnotationProcessor project(':annotation-processor')
    testImplementation(project(':test-support')) {
        exclude group: 'net.jqwik'
    }
    testImplementation(libs.networknt.json.schema.validator)
    testImplementation(libs.jazzer.junit)
}

// Regenerates the intent part of the QuickTx transaction schema from the Jackson model.
// TxPlanSchemaTest fails until this is run after an intent is added or changed.
tasks.register('generateTxPlanSchema', JavaExec) {
    group = 'build'
    description = 'Regenerates the generated intent definitions in quicktx-transaction-v1alpha1.schema.json'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bloxbean.cardano.client.quicktx.serialization.TxPlanSchemaGenerator'
    args = [file('src/main/resources/schema/quicktx-transaction-v1alpha1.schema.json').absolutePath]
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Cardano Client QuickTx module'
                description = 'Cardano Client Lib - QuickTx Module'
            }
        }
    }
}
