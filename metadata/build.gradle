dependencies {
    api project(':common')
    api project(':crypto')
    
    implementation libs.jackson.dataformat.yaml
}

// The real transactions and blocks committed with the transaction-spec tests are also the corpus of the metadata
// differential tests here.
sourceSets.test.resources.srcDir "$rootDir/transaction-spec/src/test/resources/cbor"

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Cardano Client Metadata'
                description = 'Cardano Client Lib - Metadata Core Apis'
            }
        }
    }
}
