sonar.projectKey=bloxbean_cardano-client-lib
sonar.organization=bloxbean

# Java sources placed under src/test/resources are test fixtures consumed by
# google-testing-compile as classpath resources. Their package and path are
# intentionally decoupled (the test framework loads them via
# JavaFileObjects.forResource, not from a source root), so S1598 "file path
# should match package name" is a false positive for this whole tree.
sonar.exclusions=**/src/test/resources/**/*.java,**/src/codegen-test/resources/**/*.java,**/src/it/resources/**/*.java
