name: Clean, Build

on:
  push:
    branches:
      - master
      - develop
      - release/*
  pull_request:
    branches:
      - master
      - develop
      - release/*

# Read-only token: the jobs run the branch's or pull request's own code.
permissions:
  contents: read

jobs:
  commit-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build -PskipSigning=true --stacktrace
      # Fails the PR, not release day, when a module starts or stops publishing without the Central
      # deployment scope in build.gradle following it.
      - name: Verify Maven Central publication scope
        run: ./gradlew verifyMavenReleasePublicationScope -PskipSigning=true --stacktrace
      - name: Verify JMT golden vectors independently
        run: >-
          python3 verified-structures/jellyfish-merkle/src/test/python/verify_jmt_vectors.py
          verified-structures/jellyfish-merkle/src/test/resources/jmt/golden-vectors-v1.json

  txflow-java21:
    name: TxFlow compatibility (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: 'true'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run TxFlow tests on the optional Java 21 runtime
        run: ./gradlew :txflow:test -PskipSigning=true --stacktrace

  cbor-span-java21:
    name: CBOR span depth tests (JDK 21 virtual thread)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: 'true'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run CBOR span and transaction bytes tests, including the virtual-thread depth tests
        run: ./gradlew :common:test :transaction-spec:test -PskipSigning=true --stacktrace

  jmt-postgresql:
    name: JMT PostgreSQL qualification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yaci_store
          POSTGRES_USER: yaci
          POSTGRES_PASSWORD: dbpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yaci -d yaci_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENABLE_POSTGRES_TESTS: "true"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: yaci_store
      POSTGRES_USER: yaci
      POSTGRES_PASSWORD: dbpass
      POSTGRES_SCHEMA: jmt_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run mandatory JMT PostgreSQL suite
        run: >-
          ./gradlew :verified-structures:jellyfish-merkle-rdbms:test
          --tests "com.bloxbean.cardano.vds.jmt.rdbms.RdbmsJmtStorePostgresTest"
          -PskipSigning=true --stacktrace
      - name: Upload PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmt-postgresql-test-report
          path: |
            verified-structures/jellyfish-merkle-rdbms/build/reports/tests/test/
            verified-structures/jellyfish-merkle-rdbms/build/test-results/test/

  txflow-rdbms:
    name: TxFlow RDBMS qualification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run TxFlow RDBMS integration suite
        run: >-
          ./gradlew :txflow-extensions:txflow-store-rdbms:integrationTest
          -PskipSigning=true --stacktrace
      - name: Upload TxFlow RDBMS test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txflow-rdbms-test-report
          path: |
            txflow-extensions/txflow-store-rdbms/build/reports/tests/integrationTest/
            txflow-extensions/txflow-store-rdbms/build/test-results/integrationTest/

  jmt-fuzz:
    name: JMT bounded fuzz qualification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Fuzz NodeKey decoding
        env:
          JAZZER_FUZZ: "1"
        run: >-
          ./gradlew :verified-structures:jellyfish-merkle:test
          --tests "com.bloxbean.cardano.vds.jmt.JmtParserFuzzTest.nodeKeyDecoderRejectsMalformedInputWithoutUnexpectedFailure"
          -PskipSigning=true
      - name: Fuzz node CBOR decoding
        env:
          JAZZER_FUZZ: "1"
        run: >-
          ./gradlew :verified-structures:jellyfish-merkle:test
          --tests "com.bloxbean.cardano.vds.jmt.JmtParserFuzzTest.nodeCborDecoderRejectsMalformedInputWithoutUnexpectedFailure"
          -PskipSigning=true
      - name: Fuzz wire-proof verification
        env:
          JAZZER_FUZZ: "1"
        run: >-
          ./gradlew :verified-structures:jellyfish-merkle:test
          --tests "com.bloxbean.cardano.vds.jmt.JmtParserFuzzTest.wireProofVerifierIsTotalForBoundedUntrustedInput"
          -PskipSigning=true
      - name: Fuzz in-memory and RocksDB differential traces
        env:
          JAZZER_FUZZ: "1"
        run: >-
          ./gradlew :verified-structures:jellyfish-merkle-rocksdb:test
          --tests "com.bloxbean.cardano.vds.jmt.rocksdb.RocksDbJmtDifferentialFuzzTest.operationTraceProducesIdenticalRootsAndProofs"
          -PskipSigning=true
      - name: Fuzz version histories against the reference model
        env:
          JAZZER_FUZZ: "1"
        run: >-
          ./gradlew :verified-structures:jellyfish-merkle:test
          --tests "com.bloxbean.cardano.vds.jmt.JmtFuzzTest.operationTracesMatchModelAndReference"
          -PskipSigning=true
      - name: Fuzz mutated wire proofs
        env:
          JAZZER_FUZZ: "1"
        run: >-
          ./gradlew :verified-structures:jellyfish-merkle:test
          --tests "com.bloxbean.cardano.vds.jmt.JmtFuzzTest.mutatedWireProofsNeverProveSomethingElse"
          -PskipSigning=true
      - name: Fuzz the object proof verifier
        env:
          JAZZER_FUZZ: "1"
        run: >-
          ./gradlew :verified-structures:jellyfish-merkle:test
          --tests "com.bloxbean.cardano.vds.jmt.JmtFuzzTest.objectVerifierAcceptsOnlyTrueClaims"
          -PskipSigning=true
      - name: Fuzz in-memory, RocksDB and H2 differential histories
        env:
          JAZZER_FUZZ: "1"
        run: >-
          ./gradlew :verified-structures:jellyfish-merkle-rdbms:test
          --tests "com.bloxbean.cardano.vds.jmt.rdbms.JmtBackendDifferentialFuzzTest.historiesBehaveIdenticallyOnEveryBackend"
          -PskipSigning=true
      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jmt-fuzz-findings
          path: |
            verified-structures/jellyfish-merkle/src/test/resources/com/bloxbean/cardano/vds/jmt/JmtFuzzTestInputs/
            verified-structures/jellyfish-merkle-rdbms/src/test/resources/com/bloxbean/cardano/vds/jmt/rdbms/JmtBackendDifferentialFuzzTestInputs/

  mpf-fuzz:
    name: MPF bounded fuzz qualification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Fuzz proof decoding and verification
        env:
          JAZZER_FUZZ: "1"
        run: >-
          ./gradlew :verified-structures:merkle-patricia-forestry:test
          --tests "com.bloxbean.cardano.vds.mpf.MpfFuzzTest.verifierIsTotalForUntrustedProofBytes"
          -PskipSigning=true
      - name: Fuzz operation traces against the reference model
        env:
          JAZZER_FUZZ: "1"
        run: >-
          ./gradlew :verified-structures:merkle-patricia-forestry:test
          --tests "com.bloxbean.cardano.vds.mpf.MpfFuzzTest.operationTracesMatchReferenceAndAikenSemantics"
          -PskipSigning=true
      - name: Fuzz mutated proofs
        env:
          JAZZER_FUZZ: "1"
        run: >-
          ./gradlew :verified-structures:merkle-patricia-forestry:test
          --tests "com.bloxbean.cardano.vds.mpf.MpfFuzzTest.mutatedProofsNeverProveSomethingElse"
          -PskipSigning=true
      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mpf-fuzz-findings
          path: verified-structures/merkle-patricia-forestry/src/test/resources/com/bloxbean/cardano/vds/mpf/MpfFuzzTestInputs/

  mpf-aiken:
    name: MPF proofs checked by Aiken and the official JS library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # Fails when CCL's proofs change without regenerating onchain/lib/ccl_vectors.ak.
      - name: Check generated Aiken vectors are current
        run: >-
          ./gradlew :verified-structures:merkle-patricia-forestry:test
          --tests "com.bloxbean.cardano.vds.mpf.AikenVectorsTest"
          --tests "com.bloxbean.cardano.vds.mpf.MpfJsGoldenVectorsTest"
          -PskipSigning=true
      - name: Set up Aiken
        # aiken-lang/setup-aiken v1.0.4
        uses: aiken-lang/setup-aiken@1728a4be43be099752e22d8b841706caaa6fdd88
        with:
          version: v1.1.23
      - name: Run CCL proofs through aiken-lang/merkle-patricia-forestry
        working-directory: verified-structures/merkle-patricia-forestry/onchain
        run: aiken check
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Fails when the committed JS golden vectors no longer match what the pinned library generates.
      - name: Regenerate JS golden vectors
        working-directory: verified-structures/merkle-patricia-forestry/src/test/js
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node generate-vectors.mjs "$RUNNER_TEMP/js-vectors-v1.json"
          cmp "$RUNNER_TEMP/js-vectors-v1.json" ../resources/mpf-compat/js-vectors-v1.json
