name: Manual Snapshot Push to SNAPSHOT repo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-build:
    # The job runs the selected branch's Gradle build with the Central Portal token, so only master may
    # publish snapshots; a run started on any other branch is skipped.
    if: github.ref == 'refs/heads/master'
    # The Central Portal token is a secret of this environment.
    environment: release-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # Only -SNAPSHOT versions belong in the snapshot repository; release versions go through tag-release.yml.
      - name: Require a SNAPSHOT version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' gradle.properties \
            | head -1 | tr -d '[:space:]')
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Snapshot publishing requires a -SNAPSHOT version. Got: $VERSION" >&2
            exit 1
          fi
      - name: Build with Gradle
        run: ./gradlew clean build -PskipSigning=true --stacktrace
      # Snapshots go straight to the Central Portal snapshot repository; unlike a release there is no
      # staged deployment and nothing to approve. The version in gradle.properties must end in -SNAPSHOT.
      - name: Publish package to SNAPSHOT repository
        run: ./gradlew publishAggregationToCentralPortalSnapshots -PskipSigning=true --warn --stacktrace
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
