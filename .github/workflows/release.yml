name: Publish package to the Maven Central Repository

on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew clean build
      - name: Decode GPG Key
        run: |
          mkdir -p ~/.gradle/
          echo "${{secrets.SIGNING_KEY}}" > ~/.gradle/secring.gpg.b64
          base64 -d ~/.gradle/secring.gpg.b64 > ~/.gradle/secring.gpg
      - name: Publish package
        run: ./gradlew publishToSonatype closeSonatypeStagingRepository -Psigning.keyId=${{ secrets.SIGNING_KEY_ID }} -Psigning.password=${{ secrets.SIGNING_PASSWORD }} -Psigning.secretKeyRingFile=$(echo ~/.gradle/secring.gpg) --warn --stacktrace
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
      # The verified-structures load tools are not published to Maven Central (the shaded jar
      # is ~100 MB). Attach the runnable jar to the GitHub release for the tag instead. If the
      # release already exists, its name and notes are kept and only the asset is added.
      - name: Attach load tools jar to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: verified-structures/load-tools/build/libs/cardano-client-vds-load-tools-*-all.jar
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
#      - name: Close And Release Repository
