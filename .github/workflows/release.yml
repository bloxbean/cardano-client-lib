name: Stage release to Maven Central

# Step 3 of the PR-gated release flow, 0.7.x maintenance line. A v* tag, created by tag-release.yml
# after a code-owner-approved version bump merges to release/0.7.x, builds and signs every module and
# uploads a staging repository through Sonatype's OSSRH Staging API. Closing it hands it to the Central
# Portal as a deployment. It stops there: nothing is on Maven Central until a human publishes the
# deployment in the portal.
#
# Unlike master, this branch stays on Gradle 7.5.1 and JDK 11 (the artifacts target Java 11), so it keeps
# the gradle-nexus plugin; nmcp needs Gradle 8.8+ on JDK 17.
#
# The GitHub release is a separate job, gated by github_release in gradle.properties. It is the only
# job with a write token, and it never sees the release secrets.

on:
  push:
    tags:
      - 'v*'

permissions: {}

# Never cancel a run that may already have uploaded a staging repository.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The signing subkey and Central Portal token are secrets of this environment, which only accepts
    # v* tags (plus master and release/** for the other release workflows). Only the release App and
    # org admins can create v* tags.
    environment: release-staging
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_final: ${{ steps.version.outputs.is_final }}
      github_release: ${{ steps.version.outputs.github_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate tag and read release flags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # gradle.properties uses `key = value`; reading it through Gradle tolerates the spaces.
          PROPS=$(./gradlew -q properties)
          VERSION=$(awk '/^version:/ { print $2; exit }' <<< "$PROPS")
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Git tag ${GITHUB_REF_NAME} does not match Gradle version ${VERSION}" >&2
            exit 1
          fi
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::Release tags require a non-SNAPSHOT version. Got: $VERSION" >&2
            exit 1
          fi
          IS_FINAL=false
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_FINAL=true
          fi
          # A GitHub release is deletable, unlike a Central version, but it still notifies watchers
          # and advertises the tag as a real release. Gating it lets a tag rehearse the whole
          # pipeline and stage Maven Central only.
          GITHUB_RELEASE=$(awk '/^github_release:/ { print $2; exit }' <<< "$PROPS")
          {
            echo "version=$VERSION"
            echo "is_final=$IS_FINAL"
            echo "github_release=${GITHUB_RELEASE:-false}"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (final: $IS_FINAL), GitHub release: ${GITHUB_RELEASE:-false}"

      - name: Build with Gradle
        run: ./gradlew clean build --stacktrace

      # Uploads and closes a staging repository. Closing transfers it to the Central Portal as a
      # deployment that waits for a human to publish it; this workflow never releases it.
      - name: Upload staging repository to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          # Signing subkey passed to Gradle in memory (see configureReleaseSigning in build.gradle):
          # nothing is written to disk and nothing appears on the command line.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY_ASC }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToSonatype closeSonatypeStagingRepository --stacktrace

      - name: Record the pending deployment
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_RELEASE: ${{ steps.version.outputs.github_release }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Maven Central deployment staged - NOT published"
            echo
            echo "\`cardano-client-lib:$VERSION\` was uploaded and closed, and is waiting for a human."
            echo
            echo "Check validation and publish it in the portal:"
            echo "https://central.sonatype.com/publishing/deployments"
            echo
            if [[ "$GITHUB_RELEASE" == "true" ]]; then
              echo "The GitHub release job runs next (github_release = true)."
            else
              echo "No GitHub release for this tag (github_release = false)."
              echo "If this was a rehearsal, drop the deployment in the portal."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: publish
    # Gated by github_release in gradle.properties. Runs only after the Central deployment is staged,
    # and on failure can be re-run on its own without touching Central.
    if: needs.publish.outputs.github_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Creates the release for the tag, or leaves an existing one in place. Do not pre-create a draft
      # release for the tag: the action publishes an existing draft.
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.publish.outputs.version }}
          prerelease: ${{ needs.publish.outputs.is_final != 'true' }}
          # Latest is decided by semantic version and date, so a maintenance release (e.g. 0.7.3
          # after 0.8.0) does not take the Latest badge.
          make_latest: legacy
