name: Documentation

# Builds the documentation site in www/ (Astro/Starlight) and publishes it to GitHub Pages at
# cardano-client.dev.
#
# Pull requests that touch the site only build. A push to master that touches it, or a manual run on
# master, also pushes the site to the gh-pages branch. The live site does not change until GitHub's
# Pages deployment for that push is approved in the `github-pages` environment, so every publish --
# whichever way it was triggered -- goes through that approval.

on:
  push:
    branches: [master]
    paths:
      - 'www/**'
      # www generates its module catalog and llms.txt from these.
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    branches: [master]
    paths:
      - 'www/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Astro 6 wants Node 22.19+.
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Build site
        working-directory: www
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: www/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to gh-pages
    needs: build
    # Only master publishes; a pull request, or a manual run on another branch, only builds.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      # Replaces the whole gh-pages tree with the site, so removed pages disappear from it too.
      - name: Push site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: cardano-client.dev

      - name: Record the pending Pages deployment
        shell: bash
        run: |
          {
            echo "## Pushed to gh-pages - waiting for approval"
            echo
            echo "cardano-client.dev updates after the \`pages-build-deployment\` run for this push is"
            echo "approved in the \`github-pages\` environment:"
            echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/pages/pages-build-deployment"
            echo
            echo "If several are waiting, approve the newest and reject the older ones."
          } >> "$GITHUB_STEP_SUMMARY"
