name: Documentation

# Builds the documentation sites and publishes them to GitHub Pages (cardano-client.dev):
#   - docs/  (Nextra, frozen)      -> site root
#   - www/   (Astro/Starlight)     -> /next/ preview, built only once www/ exists on the branch
#
# Pull requests that touch the docs only build. A push to master that touches them, or a manual run on
# master, also pushes the assembled site to the gh-pages branch. The live site does not change until
# GitHub's Pages deployment for that push is approved in the `github-pages` environment, so every
# publish -- whichever way it was triggered -- goes through that approval.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'www/**'
      # www generates its module catalog and llms.txt from these.
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'www/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Astro site is served as a preview under this path next to the frozen Nextra site.
  WWW_BASE_PATH: /next

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build docs (Nextra)
        working-directory: docs
        run: |
          npm ci
          npm run build

      - name: Set up Node.js for www
        if: hashFiles('www/package.json') != ''
        uses: actions/setup-node@v4
        with:
          # Astro 6 wants Node 22.19+.
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Build www (Astro)
        if: hashFiles('www/package.json') != ''
        working-directory: www
        env:
          BASE_PATH: ${{ env.WWW_BASE_PATH }}
        run: |
          npm ci
          npm run build

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp -R docs/out/. site/
          if [[ -d www/dist ]]; then
            mkdir -p "site${WWW_BASE_PATH}"
            cp -R www/dist/. "site${WWW_BASE_PATH}/"
            echo "Assembled docs/ at / and www/ at ${WWW_BASE_PATH}/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Assembled docs/ at / (no www/ on this ref)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to gh-pages
    needs: build
    # Only master publishes; a pull request, or a manual run on another branch, only builds.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      # Replaces the whole gh-pages tree with the assembled site, so pages removed from either source
      # disappear from the published site too.
      - name: Push site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: cardano-client.dev

      - name: Record the pending Pages deployment
        shell: bash
        run: |
          {
            echo "## Pushed to gh-pages - waiting for approval"
            echo
            echo "cardano-client.dev updates after the \`pages-build-deployment\` run for this push is"
            echo "approved in the \`github-pages\` environment:"
            echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/pages/pages-build-deployment"
            echo
            echo "If several are waiting, approve the newest and reject the older ones."
          } >> "$GITHUB_STEP_SUMMARY"
