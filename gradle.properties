group = com.bloxbean.cardano
artifactId = cardano-client-lib
version = 0.8.0-pre6-dev1
# Release side effect of a v* tag, independent of the Maven Central deployment. The Central deployment
# is always staged (USER_MANAGED) and needs a human to publish it, but the GitHub release (with the
# load-tools jar) is public the moment the tag is pushed. Set to false to rehearse the release
# pipeline end to end without publishing anything.
github_release = false
