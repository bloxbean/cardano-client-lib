group = com.bloxbean.cardano
artifactId = cardano-client-lib
version = 0.8.0-pre6-SNAPSHOT
github_release = true

# Where a v* tag publishes the Maven artifacts (bloxbean/release-ops docs/12-bloxbean-maven-repository.md). Both are
# built and signed once, so with both true the same files go to both. A Central deployment is staged and still needs a
# human to publish it; the BloxBean repository (https://repo.bloxbean.org/maven/releases) is public, and permanent,
# the moment the release run uploads it. Turn Central off to release to the BloxBean repository only (e.g. Central's
# quota is exhausted).
maven_central_publish = true
bloxbean_repo_publish = true
