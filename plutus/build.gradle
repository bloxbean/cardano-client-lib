dependencies {
    api project(':common')
    api project(':common-spec')
    testImplementation(project(':test-support')) {
        exclude group: 'net.jqwik'
    }
}

// The real transactions and blocks committed with the transaction-spec tests are also the corpus of the Plutus data
// codec differential tests here.
sourceSets.test.resources.srcDir "$rootDir/transaction-spec/src/test/resources/cbor"

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Cardano Client Plutus module'
                description = 'Cardano Client Lib - Plutus Module'
            }
        }
    }
}
