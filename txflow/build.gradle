plugins {
    id 'java-test-fixtures'
}

dependencies {
    api project(':core')
    api project(':core-api')
    api project(':function')
    api project(':quicktx')
    api project(':backend')

    // YAML/JSON serialization
    implementation libs.jackson.databind
    implementation libs.jackson.dataformat.yaml
    implementation libs.jackson.datatype.jsr310

    // Lombok for reducing boilerplate in model classes
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    testFixturesImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.0'

    // Validates embedded transactions against the QuickTx schema
    // Keep tests on the Jackson the library ships: the validator would otherwise pull a newer one onto the test classpath.
    testImplementation(libs.networknt.json.schema.validator) {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.dataformat'
    }

    // Integration test dependencies
    integrationTestImplementation project(':backend-modules:blockfrost')
    integrationTestImplementation project(':cip:cip20')
    integrationTestImplementation(libs.aiken.java.binding)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Cardano Client TxFlow module'
                description = 'Cardano Client Lib - TxFlow Module for multi-step transaction orchestration'
            }
        }
    }
}
