dependencies {
    api project(':common')
    api project(':crypto')
    api project(':common-spec')
    api project(':ledger-cbor')
    api project(":address")
    api project(':metadata')
    api project(':plutus')

    implementation(libs.guava)
    testImplementation(testFixtures(project(':ledger-cbor')))
    testImplementation(project(':test-support')) {
        exclude group: 'net.jqwik'
    }
}

test {
    // The CBOR conformance gate: the dataset is fetched by CI and never copied here. See CborCorpusConformanceTest.
    if (project.hasProperty('cborDataset')) {
        systemProperty 'cbor.dataset', file(project.property('cborDataset')).absolutePath
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Cardano Client Transaction Spec (Serialization) module'
                description = 'Cardano Client Lib - Transaction Spec Module'
            }
        }
    }
}
