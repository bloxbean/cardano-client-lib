dependencies {
    api project(':common')
    api project(':crypto')
    api project(':common-spec')
    api project(":address")
    api project(':metadata')
    api project(':plutus')

    implementation(libs.guava)
    testImplementation(project(':test-support')) {
        exclude group: 'net.jqwik'
    }
}

test {
    // The CBOR conformance gate: the dataset is fetched by CI and never copied here. See CborCorpusConformanceTest.
    // The dataset is a test input too, so a changed dataset at the same path runs the tests again.
    if (project.hasProperty('cborDataset')) {
        def cborDataset = file(project.property('cborDataset'))
        systemProperty 'cbor.dataset', cborDataset.absolutePath
        inputs.dir(cborDataset).withPropertyName('cborDataset').withPathSensitivity(PathSensitivity.RELATIVE)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Cardano Client Transaction Spec (Serialization) module'
                description = 'Cardano Client Lib - Transaction Spec Module'
            }
        }
    }
}
